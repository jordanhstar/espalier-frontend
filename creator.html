<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile — Espalier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0E0F11;
    --lA:#C4875A; --lB:#A66F45; --rA:#565FAE; --rB:#3F4680;
    --border:#E4E1D6; --dim:#7B828A; --surface:#fff;
    --font-display:'Sora', system-ui, sans-serif; --font-body:'Manrope', system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:#F5F6F1; color:#15181D; font-family:var(--font-body); -webkit-font-smoothing:antialiased;}
  a{color:inherit;}
  header{display:flex; align-items:center; justify-content:space-between; padding:24px 32px; max-width:900px; margin:0 auto;}
  .brand{display:flex; align-items:center; gap:8px; font-family:var(--font-display); font-weight:800; font-size:16px; text-decoration:none; color:#15181D;}
  .wrap{max-width:760px; margin:0 auto; padding:20px 24px 80px;}
  .profile-head{display:flex; align-items:center; gap:20px; margin-bottom:28px;}
  .avatar{width:84px; height:84px; border-radius:50%; background:linear-gradient(135deg, var(--lA), var(--rA)); display:flex; align-items:center; justify-content:center; color:#fff; font-family:var(--font-display); font-weight:800; font-size:26px; flex-shrink:0; background-size:cover; background-position:center;}
  .name-row{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  h1{font-family:var(--font-display); font-size:24px; margin:0;}
  .badge{display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.03em; padding:4px 10px; border-radius:100px;}
  .badge.verified{background:#E1F1EA; color:#1F8A70;}
  .badge.founding{background:#FBEDD8; color:#C97F1E;}
  .headline{color:var(--dim); font-size:14.5px; margin-top:4px;}
  .bio{font-size:15px; line-height:1.7; margin:24px 0; white-space:pre-wrap;}
  .stats-row{display:flex; gap:28px; margin:24px 0; padding:18px 0; border-top:1px solid var(--border); border-bottom:1px solid var(--border);}
  .stat{text-align:left;}
  .stat .n{font-family:var(--font-display); font-weight:800; font-size:20px;}
  .stat .l{font-size:12px; color:var(--dim);}
  .accomplishments{margin:24px 0;}
  .accomplishments ul{margin:8px 0 0; padding-left:20px;}
  .accomplishments li{margin-bottom:6px; font-size:14px;}
  .links{display:flex; flex-wrap:wrap; gap:10px; margin:20px 0;}
  .links a{font-size:13px; font-weight:700; color:var(--rA); border:1px solid var(--border); border-radius:100px; padding:7px 16px; text-decoration:none;}
  .section-h{font-family:var(--font-display); font-weight:700; font-size:15px; margin:32px 0 12px;}
  .idea-card{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px 20px; margin-bottom:10px;}
  .idea-card .t{font-weight:700; font-size:14px;}
  .idea-card .s{font-size:12.5px; color:var(--dim); margin-top:2px;}
  .empty{color:var(--dim); font-size:14px; padding:20px 0;}
  .loading{text-align:center; padding:80px 20px; color:var(--dim);}
</style>
</head>
<body>
<header>
  <a class="brand" href="index.html">🌱 Espalier</a>
  <a href="index.html" style="font-size:13px; font-weight:700;">← Back Home</a>
</header>
<div class="wrap" id="content">
  <div class="loading">Loading…</div>
</div>

<script>
const API_BASE = 'https://baton-backend.jordanhstar.workers.dev';
const params = new URLSearchParams(window.location.search);
const username = params.get('u');
const id = params.get('id');

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

async function load(){
  const content = document.getElementById('content');
  if(!username && !id){
    content.innerHTML = '<div class="empty">No profile specified.</div>';
    return;
  }
  try {
    const path = username ? `/api/creators/by-username/${encodeURIComponent(username)}` : `/api/creators/${encodeURIComponent(id)}`;
    const res = await fetch(API_BASE + path);
    if(!res.ok){
      content.innerHTML = `<div class="empty">This profile doesn't exist${username ? ` — no one has claimed <b>espalier.dev/u/${escapeHtml(username)}</b> yet.` : '.'}</div>`;
      return;
    }
    const data = await res.json();
    render(data);
  } catch(e){
    content.innerHTML = '<div class="empty">Couldn\'t load this profile — try again in a moment.</div>';
  }
}

function render(data){
  const creator = data.creator;
  const badges = [
    creator.isVerifiedMember ? '<span class="badge verified">✓ Verified member</span>' : '',
    creator.isFoundingMember ? '<span class="badge founding">★ Founding member</span>' : '',
  ].join('');

  const avatarStyle = creator.photo_url
    ? `style="background-image:url(${creator.photo_url});"`
    : `style="background:linear-gradient(135deg, ${creator.avatar_from || '#C4875A'}, ${creator.avatar_to || '#565FAE'});"`;

  const accomplishments = (() => {
    try { return JSON.parse(creator.accomplishments_json || '[]'); } catch(e) { return []; }
  })();
  const links = (() => {
    try { return JSON.parse(creator.links_json || '[]'); } catch(e) { return []; }
  })();

  document.title = `${creator.name} — Espalier`;
  document.getElementById('content').innerHTML = `
    <div class="profile-head">
      <div class="avatar" ${avatarStyle}>${creator.photo_url ? '' : (creator.initials || '?')}</div>
      <div>
        <div class="name-row"><h1>${escapeHtml(creator.name)}</h1>${badges}</div>
      </div>
    </div>
    ${creator.bio ? `<p class="bio">${escapeHtml(creator.bio)}</p>` : ''}
    <div class="stats-row">
      <div class="stat"><div class="n">${data.ideaCount ?? 0}</div><div class="l">Ideas listed</div></div>
      <div class="stat"><div class="n">${creator.followerCount ?? 0}</div><div class="l">Followers</div></div>
      ${data.reputation?.asStarter?.completed ? `<div class="stat"><div class="n">${data.reputation.asStarter.completed}</div><div class="l">Deals completed</div></div>` : ''}
    </div>
    ${accomplishments.length ? `<div class="accomplishments"><div class="section-h" style="margin-top:0;">Worth knowing</div><ul>${accomplishments.map(a => `<li>${escapeHtml(a)}</li>`).join('')}</ul></div>` : ''}
    ${links.length ? `<div class="links">${links.map(l => `<a href="${escapeHtml(l)}" target="_blank" rel="noopener">${escapeHtml(l.replace(/^https?:\/\//,''))}</a>`).join('')}</div>` : ''}
  `;
}

load();
</script>
</body>
</html>
